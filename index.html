<!DOCTYPE html>

<title>如鸢招募记录 · 预览</title>
<!-- PWA：添加到主屏幕（图标 / 全屏 / 主题色）。不引 Service Worker，避免离线缓存造成"改了不生效" -->
<link rel="manifest" href="manifest.webmanifest"/>
<meta name="theme-color" content="#8c5f2b"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="小鸢助手"/>
<link rel="apple-touch-icon" href="images/appicon.png"/>
<link rel="icon" href="images/appicon.png"/>
<!-- SheetJS：xlsx 解析/导出（副页面导入/导出功能用）。已改为按需加载：用户首次点「导入/导出」时才拉取（约 861KB），不占首屏关键路径 -->
<style>
:root{
  --bg:#fffbf5; --panel:#fff; --line:#e8d9c2; --line2:#d4bc9f;
  --ink:#4b3520; --soft:#7a5a3a;
  --gold:#8c5f2b; --gold2:#c48b2e; --goldsoft:#f0e3d2;
  --dark:#3a2c20; --dark2:#1f1611;
  --danger:#c0392b;
}
*{box-sizing:border-box}
html,body{margin:0;background:#f3ece2;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
#phone{
  width:390px;height:844px;margin:18px auto;background:var(--bg);
  border-radius:28px;box-shadow:0 12px 40px rgba(75,53,32,.22);overflow:hidden;
  display:flex;flex-direction:column;position:relative;
}
/* 手机竖屏：去掉手机壳边框，铺满全屏，打开即适配，无需手动缩放 */
@media (max-width:480px){
  html,body{margin:0;padding:0}
  #phone{width:100%;height:100vh;height:100dvh;margin:0;border-radius:0;box-shadow:none;max-width:100%}
  body{background:var(--bg)}
}
.bak-remind{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:#fff8e6;border:1px solid #f0d9a8;color:#7a5a22;font-size:12.5px;line-height:1.5}
.bak-remind .bak-go{color:#b07d2b;font-weight:700;cursor:pointer;text-decoration:underline;margin-left:4px}
#bar{position:relative;height:52px;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0}
#bar .bk{background:none;border:0;font-size:24px;color:var(--gold);padding:0 4px;line-height:1}
#bar .tt{position:absolute;left:0;right:0;top:0;line-height:51px;text-align:center;
  font-size:16px;font-weight:600;pointer-events:none;margin:0}
#bar .accbtn{margin-left:auto;background:var(--goldsoft,#f5e9d2);border:1px solid var(--line2);border-radius:20px;
  padding:4px 10px;font-size:11px;color:var(--ink);max-width:88px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.accrow .accops{padding:6px 8px;color:var(--soft);font-size:14px;flex-shrink:0}
.accrow .accops:active{color:var(--gold)}
.accrow .tx small{color:var(--gold);font-size:10px}
.accnew{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.accnew .inp{flex:1}
#body{flex:1;overflow-y:auto;padding:12px}
.hide{display:none!important}

.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--gold);background:#fffbf5;font-size:14px}
.btn:hover{background:var(--goldsoft)}
.btn.pri{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.pri:hover{background:#724e24}
.btn.del{background:#fdecea;color:var(--danger);border-color:var(--danger)}
.btn.pri,.btn.del{padding:6px 14px;font-size:12px;border-radius:6px}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1}

/* 招募页：详情页容器（padding-bottom 给底部保存键留位，savebar 随手机壳 absolute 定位） */
.pool-detail{position:relative;min-height:100%;padding-bottom:90px}
.savebar{position:absolute;left:0;right:0;bottom:0;z-index:50;
  background:linear-gradient(180deg,rgba(253,246,233,0) 0%,rgba(253,246,233,.9) 30%,#fdf6e9 60%);
  padding:14px 14px calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none}
.savebar .btn{pointer-events:auto;width:100%;max-width:360px;padding:14px 0;font-size:15px;font-weight:700;border-radius:24px;box-shadow:0 2px 8px rgba(75,53,32,.25)}

.addp-mini{font-size:11px;color:var(--gold);padding:2px 8px;border:1px solid var(--gold2);
  border-radius:10px;background:#fff;cursor:pointer}
.addp-mini:hover{background:var(--goldsoft)}

/* ============ 顶部 KPI 三连 ============ */
.kpis{display:flex;gap:8px;margin-bottom:10px}
.kpi{flex:1;background:var(--panel);border:0;border-radius:10px;padding:14px 4px 10px;text-align:center;
  box-shadow:0 1px 3px rgba(75,53,32,.06)}
.kpi .ico-img{width:44px;height:44px;border-radius:50%;margin:0 auto 8px;display:block;object-fit:cover}
.kpi .v{display:block;font-size:21px;font-weight:700;color:var(--gold)}
.kpi .l{display:block;font-size:11px;color:var(--soft);margin-top:3px}

/* ============ 抽出最多 / 歪出最多 ============ */
.top2{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px 12px;margin-bottom:10px}
.top2 .tk-item{padding:0}
.top2 .tk-item+.tk-item{border-top:1px dashed var(--line)}
.top2 .it{display:flex;align-items:center;justify-content:space-between;padding:9px 0}
.top2 .lbl{display:block;font-size:11px;color:var(--soft)}
.top2 .nm{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-top:2px}
.top2 .it-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.top2 .ct{font-size:12px;color:var(--gold2);font-weight:700;line-height:1.4;text-align:right}
.top2 .ct b{font-size:15px;color:var(--gold)}
.top2 .tk-toggle{font-size:11px;color:var(--gold);font-weight:700;cursor:pointer;user-select:none;
  padding:1px 8px;border:1px solid var(--line);border-radius:999px;background:#fdf6e9;white-space:nowrap}
.top2 .tk-toggle:hover{background:#f5e9d2}
/* 展开后的完整列表：单行 = 序号 · 定宽名 · [UP|歪|普 三个对齐定宽标签] · 个数
   列表内部纵向滚动，竖向约 9 行高度（超出用滑动查看，不撑长整页） */
.tk-list{display:none;padding:0 0 8px;max-height:342px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.tk-list.open{display:block}
.tk-list::-webkit-scrollbar{width:5px}
.tk-list::-webkit-scrollbar-thumb{background:#d8c49b;border-radius:3px}
.tk-list::-webkit-scrollbar-track{background:transparent}
.tk-row{display:flex;align-items:center;gap:6px;height:38px;box-sizing:border-box;padding:0 4px;border-radius:6px;
  border-top:1px dashed rgba(200,169,106,.45)}
.tk-row.plain{cursor:default}
.tk-rk{flex:0 0 20px;text-align:center;font-size:11px;color:var(--soft);font-weight:700}
/* 名字定宽：名字短的后面标签整体右移，从而 3 列标签在各行之间上下对齐 */
.tk-nm{flex:0 0 78px;min-width:0;font-size:13.5px;font-weight:600;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 三个标签位各定宽 + 现在空值也占位，保证纵向严格对齐 */
.tk-tags{flex:0 0 auto;display:flex;gap:5px}
.bd-chip{display:inline-block;box-sizing:border-box;font-size:10.5px;font-weight:700;line-height:18px;
  height:18px;text-align:center;border-radius:5px;white-space:nowrap;overflow:hidden}
.bd-chip:empty{border:1px solid transparent;background:transparent}
.bd-up{width:46px;color:#7a5416;background:#f3e0b6;border:1px solid #d9bd7f}
.bd-warp{width:46px;color:#fff;background:#c0392b;border:1px solid #a5301f}
.bd-pu{width:46px;color:#5b4a35;background:#ece4d6;border:1px solid #cdbfa6}
.tk-v{margin-left:auto;flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--gold)}
.tk-v-warp{color:#c0392b}

/* ============ 普池 / UP池 统计块（参考图1样式） ============ */
.two{display:flex;gap:8px;margin-bottom:12px}
.sb{flex:1;background:#fdf6e9;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sb h4{margin:0;padding:10px 8px;font-size:14px;font-weight:700;color:#5b3a1c;text-align:center;background:linear-gradient(180deg,#ecd5a5,#dcbf7a);border-bottom:1px solid #c8a96a;letter-spacing:.5px;text-shadow:0 1px 1px rgba(255,250,235,.6)}
.sb .body{padding:8px 14px;background:#fdf6e9}
.sb .ln{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink);padding:3.5px 0}
.sb .ln b{font-size:14.5px;font-weight:700;color:#5b3a1c}

/* ============ 池子列表 ============ */
.sech{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px}
.sech .t{font-size:14px;font-weight:700}
.sech .a{font-size:12px;color:var(--gold)}

.pool{display:flex;align-items:stretch;border-radius:10px;overflow:hidden;margin-bottom:10px;
  background:#1f1611;position:relative;min-height:96px;cursor:pointer}
.pool .art{position:relative;flex:1 1 50%;min-width:130px;max-width:50%;
  aspect-ratio:16/9;min-height:80px;flex-shrink:0;overflow:hidden;background:#2a1d12;
  display:flex;align-items:center;justify-content:center;border-radius:8px 0 0 8px}
.pool .meta{flex:1 1 50%;max-width:50%;padding:10px 12px;font-size:12.5px;line-height:1.7;color:#f3e6c8;
  display:flex;flex-direction:column;justify-content:center;min-width:0;overflow:hidden}
.pool .art-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left center;
  -webkit-mask-image:linear-gradient(to right,black 78%,rgba(0,0,0,.6) 90%,rgba(0,0,0,.15) 97%,transparent 100%);
  mask-image:linear-gradient(to right,black 78%,rgba(0,0,0,.6) 90%,rgba(0,0,0,.15) 97%,transparent 100%)}
.pool .pn{
  position:absolute;left:0;bottom:0;z-index:3;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  color:#fff;font-size:13px;font-weight:700;
  padding:4px 12px;border-top-right-radius:9px;
  box-shadow:0 -1px 4px rgba(0,0,0,.3);
  text-shadow:0 1px 2px rgba(0,0,0,.25);
}
.pool .pt{
  position:absolute;right:8px;top:8px;
  background:rgba(196,139,46,.92);color:#fff;font-size:10.5px;
  padding:2px 9px;border-radius:10px;z-index:3;font-weight:600;
  box-shadow:0 1px 3px rgba(0,0,0,.4);
}
.pool .mt{flex:1;padding:11px 14px;display:flex;flex-direction:column;justify-content:center;background:#1f1611;color:#d8cbb8;min-width:0}
.pool .ln{display:block;font-size:11.5px;color:#d8cbb8;line-height:1.7}
.pool .ln i{color:#ffd28a;font-style:normal;font-weight:600}
/* 右下角独立「编辑」按钮：贴近蓝框大小，背景色与卡片协调 */
.pool .ed-strip{
  position:absolute;right:0;top:0;bottom:0;width:34px;z-index:4;
  background:linear-gradient(180deg,rgba(196,139,46,.78),rgba(150,100,40,.78));
  color:#fff;
  font-size:12px;font-weight:600;letter-spacing:.5px;
  display:flex;align-items:center;justify-content:center;
  text-shadow:0 1px 1px rgba(0,0,0,.3);
  cursor:pointer;border-radius:0 8px 8px 0;
  user-select:none;
  transition:background .15s;
}
.pool .ed-strip:hover{background:linear-gradient(180deg,rgba(196,139,46,.95),rgba(120,80,32,.95))}
.pool .ed-strip::after{content:'编辑'}

/* 卡片下方的招募记录预览条（点击卡片主体展开/收起） */
.prev-strip{margin:-6px 0 10px;border:1px solid var(--line);border-radius:0 0 10px 10px;
  background:#fffbf5;padding:8px;animation:slideDown .2s ease;position:relative}
.prev-strip::before{content:'';position:absolute;left:50%;top:0;width:60%;height:2px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,rgba(196,139,46,.5),transparent)}
/* 最新抽到的放最左，按"最新→最老"从左到右排（不满 5 个时整体靠左，不靠右） */
.prev-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.addp{width:100%;padding:11px;border:1px dashed var(--gold2);background:transparent;border-radius:10px;color:var(--gold);font-size:14px;margin:2px 0 10px}

/* ============ 池子详情 ============ */
.head{position:relative;border-radius:10px;overflow:hidden;background:#1f1611;margin-bottom:10px}
.head .head-img{width:100%;height:auto;display:block}
.head .mt{display:none}

/* UP 密探行（详情页里只显示名字，不显示两张大卡） */
.uprow-line{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:10px}
.uprow-line .lbl{font-size:13px;color:var(--soft)}
.uprow-line .nm{font-size:14px;font-weight:700;color:var(--ink)}
.uprow-line .nm i{color:var(--gold);font-style:normal;font-weight:600}
.pd-period{margin:-2px 0 10px;padding:0 4px;font-size:12px;color:var(--soft);letter-spacing:.02em;text-align:right}

/* 池子属性编辑（仅 anniv） */
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:9px}
.pnl .rw{display:flex;align-items:center;justify-content:space-between;font-size:13px}
.mi{width:58px;padding:5px;border:1px solid var(--line2);border-radius:6px;text-align:center;font-size:13px;background:#fffbf5}
.tip{display:block;font-size:11px;color:var(--soft);margin-top:6px}
.pl{font-size:12px;color:var(--soft)}
.pl b{color:var(--ink);font-weight:700}
.jn{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:7px}
.jn .jl{font-size:11px;color:var(--soft)}
.jn .jt{background:var(--goldsoft);color:#a06c1f;font-size:10px;padding:2px 7px;border-radius:10px}

/* ============ 密探网格（详情页记录 + 密探库共用） ============ */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}
.cell{position:relative;border:0;border-radius:8px;overflow:hidden;background:#fff}
.cell.upc2{border:0}
.cell.bad{background:#fff2f0}
.cell.add{display:flex;align-items:center;justify-content:center;border:1px dashed var(--gold2);aspect-ratio:.78}
.cell.add span{font-size:34px;color:var(--gold2);line-height:1}
.seq{position:absolute;left:0;top:0;z-index:3;background:var(--gold2);color:#fff;font-size:10px;padding:1px 5px;border-bottom-right-radius:5px;font-weight:700}
/* 密探卡边框：去掉米黄底，仅留细边；留 2px 边距让属性图浮在右上 */
.cell .frame{position:relative;width:100%;aspect-ratio:4/5;border:1px solid #d4bc9f;border-radius:6px;box-sizing:border-box;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cell .frame img.face-img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block}
/* 属性图标：大、圆形、白边外圈 */
.cell .attr-icon{position:absolute;right:2px;top:2px;width:18px;height:18px;z-index:3;
  border-radius:50%;background:#fff;padding:1px;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.cell .placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:700;background:linear-gradient(135deg,#b99567,#8c5f2b);border-radius:3px}
.bbar{position:absolute;left:0;right:0;bottom:20px;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;gap:5px;padding:1px 0}
.bbar .cn{color:#fff;font-size:10px}
.bbar .tg{font-size:9px;padding:0 4px;border-radius:3px;font-weight:700}
.tg-u{background:#fff4dd;color:#a06c1f}.tg-b{background:#fdecea;color:#c0392b}
/* 密探名方椭圆框（选择密探 / 密探库 / 招募页通用） */
.cell .nm{display:block;text-align:center;font-size:11.5px;padding:2px;color:var(--ink);background:#fff;margin:2px 4px 4px;border:1px solid var(--gold2);border-radius:14px;font-weight:600}
.cell .mtx{display:block;text-align:center;font-size:10px;color:var(--soft);padding:0 2px 7px;background:#fff}

/* 招募页密探卡：左上序号（第几个抽出，正序）+ 底部抽数条；默认金棕，仅限定UP池"歪"的密探为红 */
.cell.rec{cursor:pointer}
/* 序号折角：数字牌只搭在密探左上角，做成水滴/折角效果 */
.cell.rec .seq{
  font-size:13px;font-weight:800;letter-spacing:.5px;color:#fff;
  width:26px;height:22px;display:flex;align-items:center;justify-content:center;
  background:rgba(196,139,46,.95);
  border-bottom-right-radius:18px;border-top-right-radius:8px;
  clip-path:polygon(0 0,100% 0,100% 70%,70% 100%,0 100%);
  text-shadow:0 1px 1px rgba(0,0,0,.4);
}
/* 底部抽数条：默认金棕 */
.cell .cell-overlay{position:absolute;left:0;right:0;bottom:0;height:18px;border-radius:0 0 6px 6px;
  pointer-events:none;z-index:2;display:flex;align-items:center;justify-content:center;
  background:rgba(196,139,46,.85)}
.cell .cell-overlay .cnt{color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.45);letter-spacing:.5px}
/* 唯一的例外：限定UP池里歪的密探（含序号与抽数条）= 红色 */
.cell.cm-warp .cell-overlay{background:rgba(192,57,43,.85)}
.cell.cm-warp .seq{background:rgba(192,57,43,.95)}

.face,.fc{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.f-fire{background:linear-gradient(135deg,#f56565,#c53030)}
.f-earth{background:linear-gradient(135deg,#a0673a,#5b3a1c)}
.f-wind{background:linear-gradient(135deg,#7bc88f,#3a8c52)}
.f-water{background:linear-gradient(135deg,#60a5fa,#1e40af)}
.f-yang{background:linear-gradient(135deg,#fcd34d,#b45309)}
.f-yin{background:linear-gradient(135deg,#a78bfa,#5b21b6)}
.f-chaos{background:linear-gradient(135deg,#4b5563,#111827)}
.f-none{background:linear-gradient(135deg,#b99567,#8c5f2b)}

.hint{background:#fff4dd;border:1px solid #e6c88a;border-radius:8px;padding:9px 10px;font-size:11.5px;color:#a06c1f;line-height:1.6;margin-bottom:9px}
.lbl{display:block;font-size:12px;color:var(--soft);margin:6px 0 5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{padding:4px 11px;border-radius:14px;border:1px solid var(--line2);background:#fff;font-size:12px}
.chip.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.d-fire{background:#e74c3c}.d-earth{background:#8b5a2b}.d-wind{background:#5fb87a}
.d-water{background:#3b82f6}.d-yang{background:#fbbf24}.d-yin{background:#8b5cf6}.d-chaos{background:#111827}

.mask{position:absolute;inset:0;background:rgba(75,53,32,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:70}
.mask .pop{position:relative;z-index:1}
.mask.nested{z-index:80}
.pop{background:#fffbf5;border-radius:14px;padding:16px;width:100%;max-height:88%;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.pop .ti{text-align:center;font-size:16px;font-weight:700;margin-bottom:14px}
.fi{margin-bottom:12px}
.fi .lb{display:block;font-size:12px;color:var(--soft);margin-bottom:5px}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:8px;font-size:14px;background:#fff;color:var(--ink)}
.pr{display:flex;align-items:center;gap:9px;border:1px solid var(--line2);border-radius:8px;padding:8px;background:#fff}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:#f5e9d2;border-radius:8px;padding:3px}
.tabs .tab{flex:1;text-align:center;padding:7px 4px;font-size:13px;color:var(--soft);border-radius:6px;cursor:pointer;font-weight:600}
.tabs .tab.on{background:var(--gold);color:#fff}

/* ============ 顶部主 nav（主页 / 副页） ============ */
.topnav{display:flex;gap:0;background:#f5e9d2;border-radius:10px 10px 0 0;margin:0 0 0;padding:4px 4px 0;border-bottom:2px solid var(--gold)}
.topnav .navtab{flex:1;text-align:center;padding:8px 4px 7px;font-size:13.5px;color:var(--soft);border-radius:8px 8px 0 0;cursor:pointer;font-weight:700;letter-spacing:.5px;transition:all .15s}
.topnav .navtab.on{background:var(--gold);color:#fff;box-shadow:0 -2px 6px rgba(196,139,46,.25)}
.topnav .navtab:hover:not(.on){background:rgba(196,139,46,.15);color:var(--ink)}

/* ============ 副页面通用 ============ */
.subhd{display:flex;align-items:center;gap:7px;margin:14px 0 10px;font-size:14px;color:var(--ink);font-weight:700}
.subhd::before{content:'';width:4px;height:14px;background:linear-gradient(180deg,var(--gold),#a06c1f);border-radius:2px}
.subhint{font-size:11px;color:var(--soft);margin:-7px 0 10px;line-height:1.5}
.subtabs{display:flex;gap:6px;margin-bottom:14px;background:#f5e9d2;border-radius:8px;padding:3px}
.subtabs .stab{flex:1;text-align:center;padding:7px 4px;font-size:12.5px;color:var(--soft);border-radius:6px;cursor:pointer;font-weight:600;transition:all .15s}
.subtabs .stab.on{background:var(--gold);color:#fff}

/* 概览 / 统计卡片 */
.stat-card{background:linear-gradient(180deg,#fff,#fdf6e9);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;box-shadow:0 1px 0 rgba(196,139,46,.06)}
.stat-card .lbl{font-size:11.5px;color:var(--soft);margin-bottom:4px;font-weight:600}
.stat-card .val{font-size:18px;color:var(--ink);font-weight:700;letter-spacing:.3px}
.stat-card .val small{font-size:11px;color:var(--soft);font-weight:500;margin-left:3px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:13px}
.stat-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}
.stat-grid .stat-card{margin:0}
.stat-card.accent{background:linear-gradient(135deg,#fdebd0,#f5d8a1);border-color:#e0b97a}
.stat-card.accent .val{color:#a06c1f}
.stat-card.cool{background:linear-gradient(135deg,#e8f1f7,#cfe0ef);border-color:#9ab8d4}
.stat-card.cool .val{color:#2b5d8a}
.stat-card.hot{background:linear-gradient(135deg,#fdecea,#fbd6d1);border-color:#d99a90}
.stat-card.hot .val{color:#c0392b}
/* 全图鉴瑕：数字橙金高亮 + 展开小按钮 + 缺失密探缩略图区 */
.fig-num{color:#d18f28;font-size:15px;font-weight:800;margin:0 2px;text-shadow:0 1px 1px rgba(209,143,40,.25)}
.stat-card .val .fig-toggle{font-size:11.5px;font-weight:700;letter-spacing:0;line-height:1.6}
.fig-toggle{font-size:11.5px;color:var(--gold);font-weight:700;cursor:pointer;user-select:none;
  padding:2px 10px;border:1px solid var(--line);border-radius:999px;background:#fdf6e9;white-space:nowrap}
.fig-toggle:hover{background:#f5e9d2}
/* 全图鉴集齐：卡片改为纵向居中容器，文字撑满整卡宽度、字距拉开 */
/* 集齐：单行大字，撑满卡片宽度；配色与其它统计卡一致（浅米白底 + 常规边框），不用专属橙金背景 */
.stat-card.fullfig{display:flex;align-items:center;justify-content:center;
  padding:11px 8px}
.stat-card.fullfig .fig-congrats{display:block;width:100%;text-align:center;font-weight:800;
  color:#c8801a;white-space:nowrap;line-height:1.2;
  font-size:clamp(13px,4.4vw,20px);letter-spacing:.02em;
  text-shadow:0 1px 2px rgba(200,128,26,.22)}
.fig-strip{margin:-4px 0 9px;border:1px solid var(--line);border-radius:10px;
  background:#fffbf5;padding:8px;animation:slideDown .2s ease}

/* 排行榜 */
.stat-block{margin-bottom:14px}
.subhd.stat-toggle{cursor:pointer;display:flex;align-items:center;gap:7px;margin:14px 0 8px;font-size:14px;color:var(--ink);font-weight:700;padding:8px 10px;border-radius:8px;background:linear-gradient(180deg,#fdf6e9,#f5e9d2);border:1px solid var(--line);user-select:none;transition:background .15s}
.subhd.stat-toggle::before{content:'';width:4px;height:14px;background:linear-gradient(180deg,var(--gold),#a06c1f);border-radius:2px;flex-shrink:0}
.subhd.stat-toggle:hover{background:linear-gradient(180deg,#f5e9d2,#ecd5a5)}
.subhd.stat-toggle .arr{font-size:11px;color:var(--gold);transition:transform .15s}
.subhd.stat-toggle.collapsed .arr{transform:rotate(-90deg)}
.subhd.stat-toggle .hint{margin-left:auto;font-size:10.5px;color:var(--soft);font-weight:500}
.subhd.stat-toggle.collapsed .hint::after{content:''}
.stat-block.collapsed>.rank,
.stat-block.collapsed>.subhint{display:none}
.rank{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:13px;max-height:320px;overflow-y:auto}
.rank::-webkit-scrollbar{width:6px}
.rank::-webkit-scrollbar-thumb{background:#d4bc9f;border-radius:3px}
.rank::-webkit-scrollbar-track{background:transparent}
.rank .rh{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:linear-gradient(180deg,#fdf6e9,#f5e9d2);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink);font-weight:700}
.rank .ri{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid #f0e5d0;font-size:12px;color:var(--ink)}
.rank .ri:last-child{border-bottom:none}
.rank .ri .rk{width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--line2);color:#fff;font-size:10.5px;font-weight:700;flex-shrink:0}
.rank .ri:nth-child(1) .rk{background:linear-gradient(135deg,#ffd700,#c9a227);box-shadow:0 1px 2px rgba(201,162,39,.4)}
.rank .ri:nth-child(2) .rk{background:linear-gradient(135deg,#c0c0c0,#888);box-shadow:0 1px 2px rgba(136,136,136,.3)}
.rank .ri:nth-child(3) .rk{background:linear-gradient(135deg,#cd7f32,#8b5a2b);box-shadow:0 1px 2px rgba(139,90,43,.3)}
.rank .ri .nm{flex:1;min-width:0;font-weight:600}
.rank .ri .v{color:var(--gold);font-weight:700;font-size:13px;white-space:nowrap}
.rank .ri .sub{font-size:10.5px;color:var(--soft);margin-left:4px}

/* 导入面板 */
.imp-pick{display:block;border:2px dashed var(--line2);border-radius:10px;padding:24px 12px;text-align:center;color:var(--soft);font-size:13px;cursor:pointer;background:#fffaf0;transition:all .2s;margin-bottom:11px}
.imp-pick:hover,.imp-pick.drag{border-color:var(--gold);background:#fdf6e9;color:var(--ink)}
.imp-pick strong{display:block;color:var(--ink);font-size:14px;margin-bottom:3px}
.imp-pick input{display:none}
.imp-result{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;background:#fff}
.imp-result h4{margin:0 0 7px;font-size:12.5px;color:var(--ink);display:flex;align-items:center;gap:5px}
.imp-result .tag{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600}
.imp-result .tag.ok{background:#d4edda;color:#155724}
.imp-result .tag.warn{background:#fff3cd;color:#856404}
.imp-result .tag.err{background:#f8d7da;color:#721c24}
.imp-result ul{margin:5px 0 0;padding-left:20px;font-size:11.5px;color:var(--ink);line-height:1.7}

.imp-result ul li.diff{color:#c0392b}
.imp-actions{display:flex;gap:8px;margin-top:11px}
.imp-actions .btn{flex:1;padding:9px 14px;font-size:13px;border-radius:8px;font-weight:600}

.exp-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12px;color:var(--ink);border-bottom:1px dashed #f0e5d0}

.exp-row .v{font-weight:700;color:var(--gold)}

.btn-down:hover{transform:translateY(-1px);box-shadow:0 3px 0 #8c5f2b}
.btn-down:active{transform:translateY(1px);box-shadow:0 1px 0 #8c5f2b}
.warn{background:#fff4dd;border:1px solid #e6c88a;border-radius:8px;padding:8px 10px;font-size:11.5px;color:#a06c1f;margin-bottom:11px}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:44vh;overflow-y:auto}
.pg .cell{border:1px solid var(--line2);border-radius:7px;overflow:hidden;background:#fff}
.pg .cell.upc2 .nm{color:#a06c1f;font-weight:700}
.empty{text-align:center;color:#999;font-size:12px;padding:24px 0;grid-column:1/-1}

/* 弹窗里的 UP 密探宫格 */
.uprow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.uprow.uprow-1{grid-template-columns:repeat(1,1fr);max-width:140px;margin:0 auto 10px}
.upc{position:relative;background:#fff;border:1px solid var(--line2);border-radius:8px;overflow:hidden;text-align:center;padding:3px}
.upc.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold2)}
.upc .up-frame{position:relative;width:100%;aspect-ratio:3/4;border:1px solid #d4bc9f;border-radius:5px;box-sizing:border-box;background:#fff;display:flex;align-items:center;justify-content:center}
.upc .up-img{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:3px;object-fit:cover}

const ORDER_NONE=9999; // 名单外密探（如庞德/郭女王，新池 UP 未录入）排到最末
function seedMeta(){const m={};SEED.forEach(x=>m[x[0]]={attr:x[1],job:x[2],releaseOrder:CHAR_ORDER[x[0]]||ORDER_NONE});return m}
let meta=seedMeta();
function isSeed(n){return SEED.some(s=>s[0]===n)}
// names() 按 releaseOrder 倒序展示（游戏后出的密探排最前）；名单外的（庞德/郭女王等）以 ORDER_NONE 排到最末
function names(){return SEED.map(x=>x[0]).concat(Object.keys(meta).filter(n=>!isSeed(n)))
  .sort((a,b)=>(meta[b].releaseOrder||ORDER_NONE)-(meta[a].releaseOrder||ORDER_NONE))}
function fc(n){return 'f-'+(AC[(meta[n]&&meta[n].attr)||'']||'none')}
function filt(a,j,ex){ex=ex||[];a=a||[];j=j||[];
  return names().filter(n=>{if(ex.indexOf(n)>=0)return false;
    const c=meta[n]||{};
    if(a.length&&a.indexOf(c.attr||'')<0)return false;
    if(j.length&&j.indexOf(c.job||'')<0)return false;
    return true})}

const SEED_VERSION=3;

const K='yiruanPool_prev';
const META_K='yiruanPool_prev_meta';   // 自定义密探图（base64）单独存，避免主数据结构被撑爆
const VER_K='yiruanPool_prev_version';
let pools=null;
function rid(){return 'p'+Date.now()+Math.floor(Math.random()*999)}
function rid2(){return 'p'+Date.now()+Math.floor(Math.random()*999)+'x'}
function defPools(){return POOL_CATALOG.map(m=>({id:rid(),name:m.name,type:m.type,tag:m.tag,up1:m.up1||'',up2:m.up2||'',start:m.start||'',end:m.end||'',pity:40,joinedUps:m.type==='pu'?[]:undefined,records:[],stat:{}}))}
/** v3 SEED 数据：xlsx「招募记录」表灌入的真实抽卡流水。仅 records 为空的池子在升级时被填充；用户已有数据不会被覆盖 */
const SEED_POOL_RECORDS={};
function defaultTag(t){if(t==='pu')return '普池';if(t==='limit')return '限定UP池';return ''}
/* ===== 多账户：每个账号一套完整数据（记录 / 保底 / 自定义图），入口在顶部标题旁 ===== */
const ACC_K='yiruanPool_prev_accounts';    // 账户表 [{id,name,createdAt}]
const CUR_K='yiruanPool_prev_curacc';      // 当前账户 id
const accDataKey=id=>'yiruanPool_prev_d_'+id;
let accList=[];   // 账户表
let curAccId='';  // 当前账户
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function initAccounts(){
  const raw=lsGet(ACC_K);
  if(raw){
    try{accList=JSON.parse(raw)||[]}catch(e){accList=[]}
    if(!accList.length)accList=[{id:'default',name:'默认账户',createdAt:Date.now()}];
    curAccId=lsGet(CUR_K)||'';
    if(!accList.find(a=>a.id===curAccId))curAccId=accList[0].id;
    return;
  }
  // 首次升级：把老 key（pools + 密探图）整体归入第一个账户，老 key 保留不动（防丢）
  const id='a'+Date.now().toString(36);
  const packs={v:0,pools:[],meta:{}};
  try{
    const s=lsGet(K); if(s)packs.pools=JSON.parse(s)||[];
    const mi=lsGet(META_K); if(mi)packs.meta=JSON.parse(mi)||{};
  }catch(e){}
  accList=[{id:id,name:'默认账户',createdAt:Date.now()}];
  curAccId=id;
  lsSet(accDataKey(id),JSON.stringify(packs));
  lsSet(ACC_K,JSON.stringify(accList));
  lsSet(CUR_K,curAccId);
}
function accOf(id){return accList.find(a=>a.id===id)}
function accName(){const a=accOf(curAccId);return a?a.name:'账户'}

function load(){
  initAccounts();
  prevOpens={};   // 账户数据换套后，展开状态全部复位
  let packs=null;
  try{packs=JSON.parse(lsGet(accDataKey(curAccId))||'null')}catch(e){packs=null}
  // 没有数据（新建空白账户 / 极端情况）：defPools() 兜底，不带种子记录
  pools=(packs&&Array.isArray(packs.pools)&&packs.pools.length)?packs.pools:defPools();
  pools.forEach(p=>{
    if(p.type==='pu'&&!p.joinedUps)p.joinedUps=[];
    // 保底剩余 pity：缺省 40，合法值 1~40 原样保留（导入的垫池数据不能被刷新掉）
    p.pity=(+p.pity>=1&&+p.pity<=40)?Math.round(+p.pity):40;
    if(p._spLabel!=null)delete p._spLabel;   // 旧字段：标签改由代码 tag 统一负责
    if(p.tag==null)p.tag=defaultTag(p.type);
    if(p.name==='燕金募秀'&&p.tag==='2周年池')p.tag='18禁池';
    if(!p.stat)p.stat={}
    if(p.bannerUrl!=null)delete p.bannerUrl;   // 旧字段：自定义 banner 已取消，图片一律用代码内置
    // 从内置清单补齐 UP / 上下线时间 / 标签（老数据可能缺这些字段；标签会随版本更新，如复刻池改 tag）
    const m=POOL_CATALOG.find(c=>c.name===p.name);
    if(m){
      if(!p.up1)p.up1=m.up1||'';if(!p.up2)p.up2=m.up2||'';
      p.start=m.start||p.start||'';
      p.end=(m.end!=null)?m.end:(p.end||'');
      if(m.tag)p.tag=m.tag;
    } else {
      if(p.start==null)p.start='';
      if(p.end==null)p.end='';
    }
  });
    // 增量同步：代码 POOL_CATALOG 里用户本地尚未拥有的池子，自动补建（只新增、不覆盖已有记录/保底）
    POOL_CATALOG.forEach(c=>{
      if(!pools.find(x=>x.name===c.name)){
        pools.push({id:rid(),name:c.name,type:c.type,tag:c.tag,up1:c.up1||'',up2:c.up2||'',start:c.start||'',end:c.end||'',pity:40,joinedUps:c.type==='pu'?[]:undefined,records:[],stat:{}});
      }
    });

  // 老账户存档里可能有历史自定义图（imgUrl）字段，这里一并清掉——页面已不使用自定义图
  Object.keys(meta).forEach(n=>{if(meta[n].imgUrl!=null)delete meta[n].imgUrl});

  recalcAll();save();
  updateAccBtn();
}
/** 用户尚未抽到过的密探（密探库全集 - 已抽到的），按密探库展示顺序返回名字数组 */
function missingChars(){
  const got={};pools.forEach(p=>(p.records||[]).forEach(r=>{got[r.charName]=1}));
  return names().filter(n=>!got[n]);
}
function save(){
  const ok=lsSet(accDataKey(curAccId),JSON.stringify({v:SEED_VERSION,pools:pools}));
  lsSet(ACC_K,JSON.stringify(accList));
  lsSet(CUR_K,curAccId);
  if(!ok){
    console.warn('save failed: quota');
    if(typeof toast==='function')toast('存储空间不足：请检查浏览器剩余空间');
  }
  // 数据已落盘 → 所有视图缓存失效，下次 render 重建
  if(typeof markAllDirty==='function')markAllDirty();
}
/* ===== 账户操作 ===== */
function updateAccBtn(){const b=$('#accBtn');if(b)b.textContent=accName()}
function switchAccount(id){
  if(id===curAccId||!accOf(id))return;
  save();
  curAccId=id;lsSet(CUR_K,curAccId);
  figOpen=false;chOpen=false;
  load();markAllDirty();render();
  toast('已切换到「'+accName()+'」');
}
function createAccount(name,copyCur){
  save();   // 先把当前账户落盘
  figOpen=false;chOpen=false;
  name=String(name||'').trim()||('账户'+(accList.length+1));
  const id='a'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36);
  let data;
  if(copyCur){
    data={v:SEED_VERSION,pools:JSON.parse(JSON.stringify(pools))};
  }else{
    data={v:SEED_VERSION,pools:defPools()};
  }
  accList.push({id:id,name:name,createdAt:Date.now()});
  curAccId=id;
  lsSet(accDataKey(id),JSON.stringify(data));
  lsSet(ACC_K,JSON.stringify(accList));
  lsSet(CUR_K,curAccId);
  load();markAllDirty();render();
  toast('已创建并切换到「'+name+'」');
}
function renameAccount(id){
  const a=accOf(id);if(!a)return;
  inputModal('重命名账户',a.name,'输入新的账户名',v=>{
    v=String(v||'').trim();if(!v)return toast('账户名不能为空');
    a.name=v;save();updateAccBtn();
    toast('已重命名为「'+v+'」');
  });
}
function deleteAccount(id){
  if(accList.length<=1)return toast('至少保留一个账户');
  const a=accOf(id);if(!a)return;
  confirmModal('删除账户「'+escHtml(a.name)+'」？<br>该账户的<b>全部记录、保底、自定义图片</b>将一并删除，且无法恢复。',()=>{
    accList=accList.filter(x=>x.id!==id);
    try{localStorage.removeItem(accDataKey(id))}catch(e){}
    if(curAccId===id){curAccId=accList[0].id;lsSet(CUR_K,curAccId);load()}
    save();updateAccBtn();render();
    toast('已删除账户');
  });
}

      '<div class="accops" data-op="ren" data-acc="'+a.id+'">✎</div>'+
      '<div class="accops" data-op="del" data-acc="'+a.id+'">🗑</div>'+
      '</div>').join('')+
    '<div class="menu-item" data-act="add"><div class="ico">＋</div><div class="tx">新建账户</div></div>'+
    '<div class="menu-item cancel" data-act="cancel"><div class="ico">✕</div><div class="tx">关闭</div></div>'+
    '</div>');
  const m=document.querySelector('.mask:last-child');
  m.onclick=e=>{
    if(e.target===m)return m.remove();
    const op=e.target.closest('.accops');
    if(op){m.remove();(op.dataset.op==='ren'?renameAccount:deleteAccount)(op.dataset.acc);return}
    const t=e.target.closest('.menu-item');if(!t)return;
    const act=t.dataset.act;
    if(act==='add'){m.remove();newAccountFlow();return}
    if(act==='cancel')return m.remove();
    const acc=t.dataset.acc;
    if(acc){m.remove();switchAccount(acc)}
  };
}

    '</div>',true);
  const m=document.querySelector('.mask:last-child');
  const inp=m.querySelector('#accNewName');
  setTimeout(()=>{try{inp.focus()}catch(e){}},100);
  m.onclick=e=>{
    if(e.target===m)return m.remove();
    const t=e.target.closest('.menu-item');if(!t)return;
    const act=t.dataset.act;
    if(act==='cancel')return m.remove();
    const name=(inp.value||'').trim();

    m.remove();
    createAccount(name,act==='copy');
  };

/* ===== 卡池上下线时间工具 =====
   start/end 均为 'YYYY-MM-DD'；end 为空 = 永不结束（普池）。
   todayStr() 取本地当天，用于判断池子是否仍在进行中。 */
function todayStr(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
/** 该池是否「仍在进行中」：有结束日且今天 < 结束日 → true；无结束日（普池）→ false */
function isOpen(p){return !!(p&&p.end&&todayStr()<p.end)}
/** 池子是否属于复刻（tag 含「复刻」）——复刻池密探早已在普池，不参与普池候选排除 */
function isReprint(p){return !!p&&String(p.tag||'').indexOf('复刻')>=0}
/** 首页卡池卡片右上角是否显示标签：普池/周年池等非 limit 池显示；
    limit 池默认不显示（限时 UP 池无需标注），但「常驻复刻」「限定复刻」要显示。 */
function showPoolTag(p){
  if(!p||!p.tag)return false;
  if(p.type!=='limit')return true;
  return isReprint(p);
}
/** '2024-10-01' → '2024/10/1'；空字符串原样返回 */
function fmtDate(d){
  if(!d)return '';
  const m=String(d).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  return m?(m[1]+'/'+(+m[2])+'/'+(+m[3])):d;
}
/** 卡池活动期间显示：'2024/10/1~2024/11/18'；普池等永不结束的显示 '2024/9/26~永久'；无开始时间返回 '' */
function poolPeriod(p){
  if(!p||!p.start)return '';
  return fmtDate(p.start)+'~'+(p.end?fmtDate(p.end):'永久');
}

function curUps(){const l=pools.filter(p=>p.type==='limit');if(!l.length)return[];
  const x=l[l.length-1];return [x.up1,x.up2].filter(Boolean)}
/** 普池当前可出的绝密密探：全集 −「限定UP池且仍在进行中」的 up1/up2。
    复刻池（常驻复刻/限定复刻）不排除——其密探早已在普池；特殊池（周年/18禁）同样不参与。
    这样并立多个 UP 池时，每个未结束的新池都正确排除。 */
function puCand(){
  const ex=[];
  pools.forEach(p=>{
    if(p.type!=='limit')return;
    if(isReprint(p))return;
    if(!isOpen(p))return;
    [p.up1,p.up2].filter(Boolean).forEach(n=>{if(ex.indexOf(n)<0)ex.push(n)});
  });
  return names().filter(n=>ex.indexOf(n)<0);
}

function recalc(p){
  const r=p.records||[];let td=0,st=0,sn=0,ns=true;
  for(let i=0;i<r.length;i++){const x=r[i];td+=+x.drawCount||0;
    if(p.type==='limit'){const iu=x.charName===p.up1||x.charName===p.up2;
      if(ns){x.isSmall=true;x.isWarp=!iu;st++;if(iu)sn++;ns=iu}else{x.isSmall=false;x.isWarp=false;ns=true}}
    else{x.isSmall=false;x.isWarp=false}}
  const ts=r.length;
  // 垫池抽数：保底剩余 pity 的反面（pity=40 → 垫0；pity=37 → 已垫3抽）；计入总抽数
  const dai=Math.max(0,Math.min(40,40-(+p.pity||40)))||0;
  p.stat={totalDraw:td+dai,totalSecret:ts,avgDraw:ts?+((td+dai)/ts).toFixed(1):0,warpRate:st?+((sn/st)*100).toFixed(1):0,dai:dai};
}
function recalcAll(){pools.forEach(recalc)}
function validate(p,test){
  if(p.type!=='limit'||(!p.up1&&!p.up2))return null;
  let ns=true;
  for(let i=0;i<test.length;i++){const iu=test[i].charName===p.up1||test[i].charName===p.up2;
    if(ns){if(!iu)ns=false}else{if(!iu)return '第 '+(i+1)+' 条是大保底位，必须选本期 UP（'+p.up1+' / '+p.up2+'）';ns=true}}
  return null
}
function bigSlot(p,recs,ti){if(p.type!=='limit')return false;let ns=true;
  for(let i=0;i<recs.length;i++){const iu=recs[i].charName===p.up1||recs[i].charName===p.up2;
    if(i===ti)return !ns;if(ns){if(!iu)ns=false}else ns=true}return false}

function overall(){
  let td=0,ts=0;const c={},w={},bd={};
  pools.forEach(p=>{td+=p.stat.totalDraw||0;ts+=p.stat.totalSecret||0;
    p.records.forEach(r=>{const nm=r.charName;c[nm]=(c[nm]||0)+1;
      const b=bd[nm]||(bd[nm]={up:0,warp:0,pu:0});
      if(p.type==='limit'){
        if(nm===p.up1||nm===p.up2)b.up++;
        else{b.warp++;w[nm]=(w[nm]||0)+1}
      }else{b.pu++}})});
  const top=o=>{let n='-',c2=0;for(const k in o)if(o[k]>c2){c2=o[k];n=k}return{name:n,count:c2}};
  const cmp=(a,b)=>b.count-a.count||a.name.localeCompare(b.name,'zh');
  const drawnList=Object.keys(c).map(nm=>{const b=bd[nm]||{up:0,warp:0,pu:0};
    return{name:nm,count:c[nm],up:b.up,warp:b.warp,pu:b.pu}}).sort(cmp);
  const warpedList=Object.keys(w).map(nm=>({name:nm,count:w[nm]})).sort(cmp);
  const sum=ps=>{let a=0,b=0,st=0,sn=0,upCount=0;
    ps.forEach(p=>{
      a+=p.stat.totalDraw||0;
      b+=p.stat.totalSecret||0;
      if(p.type==='limit'){
        // 抽出且命中当期 UP 的记录条数（不含歪）
        p.records.forEach(r=>{
          if(r.charName===p.up1||r.charName===p.up2)upCount++;
        });
      }
      let ns=true;p.records.forEach(r=>{if(p.type!=='limit')return;
        const iu=r.charName===p.up1||r.charName===p.up2;
        if(ns){st++;if(iu)sn++;if(!iu)ns=false}else ns=true})});
    return{totalDraw:a,totalSecret:b,avgDraw:b?+(a/b).toFixed(1):0,warpRate:st?+((sn/st)*100).toFixed(1):0,upCount:upCount,
      dai:ps.reduce((x,p)=>x+(p.stat.dai||0),0)}};
  return{totalDraw:td,totalSecret:ts,avgDraw:ts?+(td/ts).toFixed(1):0,
    mostDrawn:top(c),mostWarped:top(w),
    drawnList:drawnList,warpedList:warpedList,
    puStat:sum(pools.filter(p=>p.type==='pu'||p.type==='anniv')),
    upStat:sum(pools.filter(p=>p.type==='limit'))}
}

function viewOrder(){
  // 主页显示顺序：PU（永远第一）→ ANNIV（特殊池，按上线时间正序）→ LIMIT（UP 池，按上线时间倒序 = 新→老）
  const pu=pools.filter(p=>p.type==='pu');
  // --- 特殊池（周年/活动池）：按 start 正序；无 start 的沿用 POOL_CATALOG 原有顺序兜底 ---
  const annivInDb=POOL_CATALOG.filter(c=>c.type==='anniv').map(c=>c.name);
  const anniv=[];
  for(let i=0;i<annivInDb.length;i++){
    const p=pools.find(x=>x.name===annivInDb[i]&&x.type==='anniv');
    if(p)anniv.push(p);
  }
  // 用户新建、代码里没有的周年池：追加到末尾（不会重复，因为上面只取 catalog 里的）
  const annivExtras=pools.filter(p=>p.type==='anniv'&&!POOL_CATALOG.some(c=>c.name===p.name&&c.type==='anniv'));
  const annivAll=[...anniv,...annivExtras];
  const annivOrder=annivInDb.indexOf;
  annivAll.sort((a,b)=>{
    const sa=a.start||'', sb=b.start||'';
    if(sa&&sb&&sa!==sb)return sa<sb?-1:1;
    if(sa&&!sb)return -1;
    if(!sa&&sb)return 1;
    // 都无 start：保持 catalog 原顺序（自定义池排在最后）
    const ia=annivOrder(a.name), ib=annivOrder(b.name);
    if(ia<0&&ib<0)return 0;
    if(ia<0)return 1;
    if(ib<0)return -1;
    return ia-ib;
  });
  // --- UP 池：按 start 倒序（新→老）。同日并列时复刻池排在新池之后（视觉上新池在上）---
  const limit=pools.filter(p=>p.type==='limit');
  const catOrder={};
  POOL_CATALOG.forEach((c,i)=>{catOrder[c.name]=i});
  limit.sort((a,b)=>{
    const sa=a.start||'', sb=b.start||'';
    if(sa&&sb){
      if(sa!==sb)return sa<sb?1:-1;               // 日期倒序
      const ra=isReprint(a)?1:0, rb=isReprint(b)?1:0;
      if(ra!==rb)return rb-ra;                    // 同日：新池(0)在前，复刻池(1)在后
    } else if(sa){return -1} else if(sb){return 1}
    // 其余情况（都无 start / 同日同类）：沿用 catalog 倒序兜底，自定义池排最前
    const ia=catOrder[a.name], ib=catOrder[b.name];
    if(ia==null&&ib==null)return 0;
    if(ia==null)return -1;
    if(ib==null)return 1;
    return ib-ia;
  });
  return [...pu, ...annivAll, ...limit];
}

      '<div class="pg">'+(list.length?list.map(n=>{const attr=meta[n]&&meta[n].attr;
        return '<div class="cell '+(upList.indexOf(n)>=0?'upc2':'')+'" data-n="'+n+'">'+
          '<div class="frame">'+
            '<img loading="eager" class="face-img" data-char-img="'+n+'" src="'+charImg(n)+'" alt="'+n+'" onerror="window._replaceWithFace&&window._replaceWithFace(this,\'char\',this.dataset.charImg,this.dataset.charImg)"/>'+
            (attr?'<img loading="eager" class="attr-icon" src="'+attrImg(attr)+'" alt="" onerror="window._replaceAttr&&window._replaceAttr(this,\''+attr+'\')"/>':'')+
          '</div>'+
          '<span class="nm">'+n+'</span></div>'}).join('')
        :'<div class="empty">没有符合条件的密探</div>')+'</div>'+
      '<div class="btnrow" style="margin-top:12px"><button class="btn" data-x="1">取消</button></div>';
    $('#pk').querySelectorAll('[data-act=chip]').forEach(c=>c.onclick=()=>{
      const g=c.dataset.g,v=c.dataset.v;
      if(v===''){(g==='a'?a:j).length=0}
      else{const arr=(g==='a')?a:j;const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v)}
      draw();});
    $('#pk').querySelectorAll('.cell[data-n]').forEach(c=>c.onclick=()=>{onPick(c.dataset.n);d.remove()});
    $('#pk').querySelector('[data-x]').onclick=()=>d.remove();
  }
  draw();
}

function recModal(idx){
  // 草稿模式：所有读写都在 draft 上，未点保存就退出则丢弃
  const p=draft||pools[poolIdx];
  const edit=idx>=0;
  const st={charName:edit?p.records[idx].charName:'',drawCount:edit?p.records[idx].drawCount:''};
  const ex=p.type==='pu'?curUps():[];
  const ups=p.type==='limit'?[p.up1,p.up2].filter(Boolean):[];
  let tip='';
  if(p.type==='limit'){
    const test=p.records.map(r=>({charName:r.charName,drawCount:r.drawCount}));
    if(edit)test[idx]={charName:'',drawCount:0};else test.push({charName:'',drawCount:0});
    if(bigSlot(p,test,edit?idx:test.length-1))
      tip='这一条处于大保底位，必须选本期 UP（'+p.up1+' / '+p.up2+'）';
  }
  // 判断是否有 UP：UP 限定池 → 3 列；普池/周年活动池 → 1 列
  const hasUp=ups.length>0;
  const d=modal('<div class="ti">'+(edit?'编辑招募记录':'新增招募记录')+'</div><div id="rm"></div>');
  function draw(){
    if(hasUp){
      // 限定池：3 列 — UP1 / UP2 / 第三格（+ 或 已选）
      const isUp1=st.charName===p.up1, isUp2=st.charName===p.up2;
      const isPicked=st.charName&&!isUp1&&!isUp2;
      $('#rm').innerHTML=
        (tip?'<div class="warn">'+tip+'</div>':'')+
        '<div class="fi"><span class="lb">密探</span><div class="uprow">'+
          renderUpCard(p.up1,isUp1,'UP')+
          renderUpCard(p.up2,isUp2,'UP')+
          (isPicked?renderPickedCard(st.charName):renderAddCard('选择密探'))+
        '</div>'+
        '<div class="fi" style="display:flex;align-items:center;gap:10px"><span class="lb" style="margin:0;flex:0 0 auto">招募次数</span>'+
          '<input class="inp" type="number" id="rd" value="'+st.drawCount+'" placeholder="必填，1-40" min="1" max="40" style="flex:1;text-align:center"/></div>'+
        '<div class="btnrow" style="margin-top:14px">'+(edit?'<button class="btn del" data-del="1">删除</button>':'')+
          '<button class="btn" data-x="1">取消</button><button class="btn pri" data-ok="1">确认提交</button></div>';
      $('#rm').querySelectorAll('[data-up]').forEach(el=>el.onclick=()=>{st.charName=el.dataset.up;draw()});
      const pk=$('#rm').querySelector('[data-pk]');
      if(pk)pk.onclick=()=>pickerModal('选择密探',ups,ex,n=>{st.charName=n;draw()});
      const rs=$('#rm').querySelector('[data-rs]');
      if(rs)rs.onclick=()=>pickerModal('选择密探',ups,ex,n=>{st.charName=n;draw()});
    } else {
      // 普池 / 周年活动池：1 列 — 选过显示已选卡，否则显示 +
      const isPicked=!!st.charName;
      $('#rm').innerHTML=
        (tip?'<div class="warn">'+tip+'</div>':'')+
        '<div class="fi"><span class="lb">密探</span><div class="uprow uprow-1">'+
          (isPicked?renderPickedCard(st.charName):renderAddCard('选择密探'))+
        '</div>'+
        '<div class="fi" style="display:flex;align-items:center;gap:10px"><span class="lb" style="margin:0;flex:0 0 auto">招募次数</span>'+
          '<input class="inp" type="number" id="rd" value="'+st.drawCount+'" placeholder="必填，1-40" min="1" max="40" style="flex:1;text-align:center"/></div>'+
        '<div class="btnrow" style="margin-top:14px">'+(edit?'<button class="btn del" data-del="1">删除</button>':'')+
          '<button class="btn" data-x="1">取消</button><button class="btn pri" data-ok="1">确认提交</button></div>';
      const pk=$('#rm').querySelector('[data-pk]');
      if(pk)pk.onclick=()=>pickerModal('选择密探',ups,ex,n=>{st.charName=n;draw()});
      const rs=$('#rm').querySelector('[data-rs]');
      if(rs)rs.onclick=()=>pickerModal('选择密探',ups,ex,n=>{st.charName=n;draw()});
    }
    const rd=$('#rd');rd.oninput=e=>st.drawCount=e.target.value;
    $('#rm').querySelector('[data-x]').onclick=()=>d.remove();
    const dl=$('#rm').querySelector('[data-del]');
    // 草稿模式：确认提交只写到 draft，不持久化；删除单条记录同样写 draft
    if(dl)dl.onclick=()=>{
      p.records.splice(idx,1);recalc(p);d.remove();render();toast('已删除（未保存）');
    };
    $('#rm').querySelector('[data-ok]').onclick=()=>{
      if(!st.charName)return toast('请选择密探');
      const n=+st.drawCount;
      if(!n||n<1||n>40)return toast('抽数请填 1 - 40');
      const test=p.records.map(r=>({charName:r.charName,drawCount:r.drawCount}));
      if(edit)test[idx]={charName:st.charName,drawCount:n};else test.push({charName:st.charName,drawCount:n});
      const err=validate(p,test);
      if(err)return toast(err);
      if(edit)p.records[idx]={charName:st.charName,drawCount:n};
      else p.records.push({charName:st.charName,drawCount:n});
      recalc(p);
      d.remove();render();toast('已记录（未保存，点底部「保存」同步到首页）');
    };
  }
  draw();
}

/** 表2「距离下次保底还需多少次招募」解析："-" / 空 / 非数字 → 40（未抽，不计垫抽） */
function parsePity(v){
  const s=String(v==null?'':v).trim();
  if(!s||s==='-'||s==='—'||s==='–')return 40;
  const n=Number(s);
  if(!isFinite(n))return 40;
  const r=Math.round(n);
  return (r>=1&&r<=40)?r:40;
}
/** 垫池抽数 = 40 - 保底剩余；clamp 0~40 */
function daiOf(p){if(!p)return 0;const v=40-(+p.pity||40);return Math.max(0,Math.min(40,v))||0}
/** "普池（绣衣天下）" → {label:'普池', name:'绣衣天下'} */
function splitSpecial(s){
  const t=String(s==null?'':s).trim(); if(!t)return null;
  const m=t.match(/[（(]([^）)]+)[）)]/);
  if(m)return {label:t.slice(0,m.index).trim()||'特殊池',name:m[1].trim()};
  return {label:t,name:''};
}
/** 表2 H 列的「特殊池」→ 代码里的池子对象（普池按 type，周年池按括号里的池名） */
function findSpecialPool(s){
  const o=splitSpecial(s); if(!o)return null;
  if(o.name){const p=pools.find(x=>x.name===o.name); if(p)return p}
  const t=o.label||'';
  if(t.indexOf('普池')>=0||t.indexOf('常驻')>=0)return pools.find(x=>x.type==='pu')||null;
  if(o.name)return pools.find(x=>x.name.indexOf(o.name)>=0)||null;
  return null;
}

/* SheetJS 按需加载：首次用到导入/导出时才拉取 xlsx.full.min.js（约 861KB），不占首屏关键路径；加载后由 SW 缓存，二次使用瞬间完成 */
var _xlsxPromise=null;
function ensureXLSX(){
  if(typeof XLSX!=='undefined') return Promise.resolve();
  if(_xlsxPromise) return _xlsxPromise;
  _xlsxPromise=new Promise(function(res){
    var s=document.createElement('script'); s.src='xlsx.full.min.js';
    s.onload=function(){ res(); };
    s.onerror=function(){ _xlsxPromise=null; res(); };
    document.head.appendChild(s);
  });
  return _xlsxPromise;
}

async function parseXlsxFile(file){
  await ensureXLSX();
  if(typeof XLSX==='undefined')return toast('SheetJS 加载失败，请检查网络');
  _impFileName=file.name||'小鸢助手.xlsx';
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  const ws1=wb.Sheets['招募记录明细'];
  const ws2=wb.Sheets['卡池+up密探'];
  const ws3=wb.Sheets['密探库密探顺序'];
  if(!ws1)return toast('未找到「招募记录明细」表，请确认是新版小鸢助手 xlsx');
  const grid=ws=>XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
  // 列组名归一化：兼容「普池\n密探」(换行)、「普池 密探」(空格)、「普池密探」(无分隔) 等写法
  const GROUP_ALIAS=[['普池',/普池/],['东阁待贤',/东阁待贤/],['游说贤士',/游说贤士/]];
  const normKey=s=>{s=String(s||'').trim();if(!s)return'';
    for(const it of GROUP_ALIAS){if(it[1].test(s))return it[0]}
    return s.split(/[\s\n　]+/)[0]||s};
  // --- 表1 招募记录明细：按表头"序号"定位四个列组 ---
  // 限定组：序号 | 池名 | 密探 | 抽数（4列）；其余组：序号 | 密探 | 抽数（3列）
  const rows=grid(ws1);
  const hdr=rows[0]||[];
  const groups=[];
  hdr.forEach((h,i)=>{
    if(h==null||String(h).trim()!=='序号')return;
    const h2=String(hdr[i+1]||'');
    if(h2.indexOf('限定')>=0){
      groups.push({key:'limit',nameCol:i+1,recCol:i+2,drawCol:i+3});
    }else if(h2){
      groups.push({key:normKey(h2),nameCol:i+1,recCol:i+1,drawCol:i+2});
    }
  });
  const limitPools=[];const _seen={};
  const groupItems={};
  groups.forEach(g=>{if(g.key!=='limit')groupItems[g.key]=[]});
  rows.slice(1).forEach(r=>{
    groups.forEach(g=>{
      const nm=r[g.nameCol];
      if(nm==null||String(nm).trim()===''||String(nm).trim()==='-')return;
      const cnt=r[g.drawCol];
      if(cnt==null||String(cnt).trim()==='')return;
      if(g.key==='limit'){
        const pn=String(nm).trim();
        if(!_seen[pn]){_seen[pn]=true;limitPools.push({name:pn,items:[]})}
        const obj=limitPools.find(x=>x.name===pn);
        const cn=r[g.recCol];
        if(cn!=null&&String(cn).trim()!==''&&String(cn).trim()!=='-')
          obj.items.push({name:String(cn).trim(),drawCount:Number(cnt)||0});
      }else{
        groupItems[g.key].push({name:String(nm).trim(),drawCount:Number(cnt)||0});
      }
    });
  });
  limitPools.forEach(x=>{x.total=x.items.reduce((a,it)=>a+it.drawCount,0)});
  // --- 表2 卡池+up密探 ---
  // 按表头定位：up卡池 / up密探A / up密探B / 距离下次保底(限定) / 特殊池 / 距离下次保底(特殊)
  const g2=ws2?grid(ws2):[];
  let cName=1,cA=2,cB=3,cPity=null,cSp=null,cSpPity=null;
  (g2[0]||[]).forEach((h,i)=>{
    const s=String(h==null?'':h).replace(/[\s\n\r]/g,'');
    if(!s)return;
    if(s==='up卡池'||s==='卡池')cName=i;
    else if(s.indexOf('up密探A')>=0||s==='密探A')cA=i;
    else if(s.indexOf('up密探B')>=0||s==='密探B')cB=i;
    else if(s.indexOf('特殊')>=0)cSp=i;
    else if(s.indexOf('距离下次保底')>=0){ if(cSp!=null)cSpPity=i; else cPity=i; }
  });
  if(cPity==null)cPity=4;
  if(cSp!=null&&cSpPity==null)cSpPity=cSp+1;
  const cell=r=>i=>(i==null)?null:r[i];
  const upRows=g2.slice(1).filter(r=>r[cName]!=null&&String(r[cName]).trim()!=='')
    .map(r=>({
      name:String(r[cName]).trim(),
      up1:r[cA]!=null?String(r[cA]).trim():'',
      up2:r[cB]!=null?String(r[cB]).trim():'',
      pity:parsePity(cell(r)(cPity)),
      special:r[cSp]!=null&&String(r[cSp]).trim()!==''?String(r[cSp]).trim():'',
      specialPity:parsePity(cell(r)(cSpPity))
    }));
  // --- 表3 密探库密探顺序 ---
  const orderNew=ws3?grid(ws3).slice(1).filter(r=>r[1]).map(r=>String(r[1]).trim()):[];
  _impParsed={limitPools,groupItems,upRows,orderNew,parsedAt:Date.now()};
  renderImpResult();
}

function applyImportToPools(){
  const r=_impParsed;if(!r)return toast('请先选文件');
  let poolNew=0,limitWritten=0,recWritten=0,spWritten=0;
  // --- 表2 卡池+up密探：有则更新 UP + 保底剩余，无则新建；表里没有的池子不动 ---
  (r.upRows||[]).forEach(u=>{
    if(!u.name)return;
    let p=pools.find(x=>x.name===u.name);
    if(!p){
      p={id:rid2(),name:u.name,type:'limit',tag:'限定UP池',up1:u.up1||'',up2:u.up2||'',start:'',end:'',pity:parsePity(u.pity),records:[],stat:{}};
      pools.push(p);
      if(!POOL_CATALOG.find(c=>c.name===u.name))
        POOL_CATALOG.push({name:u.name,type:'limit',tag:'限定UP池',up1:u.up1||'',up2:u.up2||''});
      poolNew++;
    }else{
      if(u.up1)p.up1=u.up1;
      if(u.up2)p.up2=u.up2;
      p.pity=parsePity(u.pity);          // E 列：限定池保底剩余
    }
    // H/I 列：挂在这一行的「特殊池」（普池 / 周年池）保底剩余
    if(u.special){
      const sp=findSpecialPool(u.special);
      if(sp){
        sp.pity=parsePity(u.specialPity);
        sp._spAnchor=u.name;                 // 记住导出时放回哪一行（标签一律以代码 tag 为准）
        spWritten++;
      }
    }
  });
  // --- 表1 限定组：出现的池子全量覆盖 records；没出现的池子保留不动 ---
  (r.limitPools||[]).forEach(x=>{
    let p=pools.find(y=>y.name===x.name);
    if(!p){
      p={id:rid2(),name:x.name,type:'limit',tag:'限定UP池',up1:'',up2:'',start:'',end:'',pity:40,records:[],stat:{}};
      pools.push(p);
      if(!POOL_CATALOG.find(c=>c.name===x.name))
        POOL_CATALOG.push({name:x.name,type:'limit',tag:'限定UP池',up1:'',up2:''});
      poolNew++;
    }
    p.records=x.items.map(it=>({charName:it.name,drawCount:it.drawCount}));
    limitWritten++;recWritten+=p.records.length;
  });
  // --- 表1 普池 / 周年池 / 特殊池组：按表头归位到对应池子（表里没有该组则不动）---
const gi=r.groupItems||{};
const _poolByGroupKey=k=>{
  k=String(k||'').trim();
  if(k.indexOf('普池')>=0)return pools.find(p=>p.type==='pu');
  let nm=k.replace(/密探$/,'');
  let p=pools.find(x=>x.name===nm);
  if(!p)p=pools.find(x=>x.name&&(nm.indexOf(x.name)>=0||x.name.indexOf(nm)>=0));
  return p;
};
Object.keys(gi).forEach(k=>{
  const items=gi[k]; if(!items||!items.length)return;
  const p=_poolByGroupKey(k);
  if(p){ p.records=items.map(it=>({charName:it.name,drawCount:it.drawCount})); recWritten+=p.records.length; }
});
  // --- 表3 密探顺序：表内老→新，代码 UI 倒序展示 ---
  if(r.orderNew&&r.orderNew.length){
    r.orderNew.forEach((nm,i)=>{if(meta[nm])meta[nm].releaseOrder=i+1});
    Object.keys(meta).forEach(n=>{if(r.orderNew.indexOf(n)<0)meta[n].releaseOrder=ORDER_NONE});
  }
  recalcAll();save();
  const daiAll=pools.reduce((a,p)=>a+daiOf(p),0);
  toast('已应用：限定 '+limitWritten+' 池覆盖'+(poolNew?'、新建 '+poolNew+' 池':'')+'、共 '+recWritten+' 条记录'
    +'｜保底剩余已写入'+(spWritten?'（含 '+spWritten+' 个普池/周年池）':'')+'，垫池合计 '+daiAll+' 抽');
  subView='overview';go('sub');
}

async function exportToXlsx(){
  await ensureXLSX();
  if(typeof XLSX==='undefined')return toast('SheetJS 加载失败，请检查网络');
  const limCatalog=POOL_CATALOG.filter(p=>p.type==='limit'); // 老→新
  // --- 表1：四个列组 ---
  // 限定组：按池子老→新顺序、池内按抽中先后，序号全局连续；0 抽的池子跳过
  const limitRows=[];
  let serial=1;
  limCatalog.forEach(c=>{
    const p=pools.find(x=>x.name===c.name&&x.type==='limit');
    if(!p||!p.records.length)return;
    p.records.forEach(rc=>limitRows.push([serial++,c.name,rc.charName,Number(rc.drawCount)||0]));
  });
  const toItems=p=>((p&&p.records)||[]).map(rc=>({name:rc.charName,count:Number(rc.drawCount)||0}));
// 非限定列组：普池 + 所有周年/特殊池（按 POOL_CATALOG 顺序），每块 = 序号 / 池名密探 / 抽数
const nonLimitDefs=[];
const _puP=pools.find(p=>p.type==='pu'); if(_puP)nonLimitDefs.push(_puP);
POOL_CATALOG.filter(c=>c.type==='anniv'||c.type==='special').forEach(c=>{
  const p=pools.find(x=>x.name===c.name&&(x.type==='anniv'||x.type==='special'));
  if(p)nonLimitDefs.push(p);
});
const nonLimitItems=nonLimitDefs.map(p=>({p,items:toItems(p)}));
const limTotal=limitRows.reduce((a,r)=>a+r[3],0);
const nRows=Math.max(limitRows.length,...nonLimitItems.map(o=>o.items.length),1);
const _START=6,_STEP=5;
const _W=Math.max(19,_START+nonLimitItems.length*_STEP);
const _colLetter=idx=>{let s='';let n=idx+1;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+(n-1)%26)+s;n=Math.floor((n-1)/26)}return s};
const aoa=[];
const hdr=new Array(_W).fill(null);
hdr[0]='序号';hdr[1]='限定UP池';hdr[2]='密探';
nonLimitItems.forEach((o,k)=>{
  const c=_START+k*_STEP;
  hdr[c]='序号';
  hdr[c+1]=(o.p.type==='pu'?o.p.tag:o.p.name)+'密探';
});
aoa.push(hdr);
for(let i=0;i<nRows;i++){
  const row=new Array(_W).fill(null);
  const lr=limitRows[i];
  if(lr){row[0]=lr[0];row[1]=lr[1];row[2]=lr[2];row[3]=lr[3]}
  nonLimitItems.forEach((o,k)=>{
    const c=_START+k*_STEP;
    if(o.items[i]){row[c]=i+1;row[c+1]=o.items[i].name;row[c+2]=o.items[i].count}
    if(i===0&&!o.items.length){row[c]='-';row[c+1]='-';row[c+2]='-'}
  });
  aoa.push(row);
}
const ws1=XLSX.utils.aoa_to_sheet(aoa);
// 垫池抽数 = 40 - 保底剩余（pity），各块各自汇总
const daiOf=p=>{if(!p)return 0;const v=40-(+p.pity||40);return Math.max(0,Math.min(40,v))||0};
const limDai=limCatalog.reduce((a,c)=>a+daiOf(pools.find(x=>x.name===c.name&&x.type==='limit')),0);
const setF=(addr,col,total,dai)=>{
  const f=dai>0
    ?'"抽数|（总抽数"&(SUM('+col+'2:'+col+'9999)+'+dai+')&"·含垫'+dai+'）"'
    :'"抽数|（总抽数"&SUM('+col+'2:'+col+'9999)&"）"';
  ws1[addr]={t:'s',f:f,v:'抽数|（总抽数'+(total+dai)+(dai>0?'·含垫'+dai:'')+'）'};
};
setF('D1','D',limTotal,limDai);
nonLimitItems.forEach((o,k)=>{
  const c=_START+k*_STEP;
  const col=_colLetter(c+2);
  const total=o.items.reduce((a,it)=>a+it.count,0);
  const dai=daiOf(o.p);
  setF(col+'1',col,total,dai);
});
  // --- 表2：卡池+up密探（全部 UP 池，老→新）+ E 列保底剩余 + H/I 列普池·周年池保底剩余 ---
  const PITY_H='距离下次保底还需多少次招募（未抽池子填“-”或“40”）';
  const upRows=[['序列','up卡池','up密探A','up密探B',PITY_H,null,null,'特殊池',PITY_H]];
  let s2=1;
  const pityCell=p=>{
    if(!p)return 40;
    const has=(p.records||[]).length>0;
    return has?(Number(p.pity)||40):'-';   // 没抽过的池子写 "-"，跟原表一致
  };
  limCatalog.forEach(c=>{
    const p=pools.find(x=>x.name===c.name&&x.type==='limit');
    upRows.push([s2++,c.name,c.up1||'',c.up2||'',pityCell(p),null,null,null,null]);
  });
  // 特殊池（普池 / 1周年 / 1.5周年）写回 H/I 列：优先放回导入时它原来所在的那一行
  const spList=[];
  const puP2=pools.find(p=>p.type==='pu'); if(puP2)spList.push(puP2);
  POOL_CATALOG.filter(c=>c.type==='anniv'||c.type==='special').forEach(c=>{const p=pools.find(x=>x.name===c.name&&(x.type==='anniv'||x.type==='special')); if(p)spList.push(p)});
  spList.forEach(sp=>{
    const label=sp.tag||'特殊池';   // 以代码里的 tag 为准（东阁待贤=1周年池 / 游说贤士=1.5周年池）
    let idx=sp._spAnchor?upRows.findIndex((r,i)=>i>0&&r[1]===sp._spAnchor):-1;
    if(idx<0)idx=upRows.findIndex((r,i)=>i>0&&r[7]==null);
    if(idx<0){upRows.push([upRows.length,'','','',40,null,null,'',40]);idx=upRows.length-1}
    upRows[idx][7]=label+'（'+sp.name+'）';
    upRows[idx][8]=pityCell(sp);
  });
  // --- 表3：密探库密探顺序（老→新，代码 UI 倒序）---
  const ordered=names().slice().sort((a,b)=>(meta[a].releaseOrder||ORDER_NONE)-(meta[b].releaseOrder||ORDER_NONE))
    .filter(n=>meta[n].releaseOrder!==ORDER_NONE);
  const orderRows=[['序列','密探库密探顺序（用户界面倒序）']].concat(ordered.map((n,i)=>[i+1,n]));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws1,'招募记录明细');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(upRows),'卡池+up密探');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(orderRows),'密探库密探顺序');
  XLSX.writeFile(wb,exportFileName());
  toast('已导出 '+exportFileName());
}

// ========== 副页 · JSON 备份 / 恢复 ==========
function backupName(){
  const d=new Date();
  return '小鸢助手备份'+String(d.getFullYear()).slice(2)+'.'+(d.getMonth()+1)+'.'+d.getDate()+'.json';
}
function downloadText(name,text,mime){
  const blob=new Blob([text],{type:mime||'application/json;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{try{URL.revokeObjectURL(a.href)}catch(e){} a.remove()},2000);
}
/** 备份：全部账户的抽卡记录 + 保底剩余。up1/up2 只作参考，恢复时以代码为准 */
function backupToJson(){
  save();   // 当前账户先落盘，保证备份是最新的
  const accounts=accList.map(a=>{
    let d=null;
    try{d=JSON.parse(lsGet(accDataKey(a.id))||'null')}catch(e){}
    return {id:a.id,name:a.name,data:d||{v:SEED_VERSION,pools:defPools()}};
  });
  const data={
    app:'小鸢助手',type:'backup',multi:true,createdAt:new Date().toISOString(),
    accounts:accounts
  };
  let text;
  try{ text=JSON.stringify(data) }
  catch(e){ return toast('备份失败：数据无法序列化') }
  downloadText(backupName(),text);
  lsSet('yiruanPool_prev_lastbackup',String(Date.now()));
  toast('已备份 '+accounts.length+' 个账户 → '+backupName());
}
function readBackupFile(f){
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>restoreFromJson(String(r.result||''));
  r.onerror=()=>toast('读取备份文件失败');
  r.readAsText(f,'utf-8');
}
/** 把备份里的一份账户数据按「池子清单以代码为准」整理：记录/保底/图取备份，其余取代码 */
function sanitizePack(pack){
  const bpools=(pack&&Array.isArray(pack.pools))?pack.pools:[];
  const out=defPools().map(p=>{
    const b=bpools.find(x=>x.name===p.name);
    if(!b)return p;
    p.records=(b.records||[]).map(r=>({charName:r.charName,drawCount:Number(r.drawCount)||0}));
    if(b.pity!=null)p.pity=(+b.pity>=1&&+b.pity<=40)?Math.round(+b.pity):40;
    if(!p.up1&&b.up1)p.up1=b.up1;           // 只在代码没配时补齐，不覆盖代码
    if(!p.up2&&b.up2)p.up2=b.up2;
    return p;
  });
  return {v:SEED_VERSION,pools:out};
}
/** 恢复：旧格式（单账户）恢复到当前账户；新格式（multi）按账户名对号入座，没有的账户自动新建 */
function restoreFromJson(txt){
  let d;
  try{ d=JSON.parse(txt) }catch(e){ return toast('不是有效的备份文件（JSON 解析失败）') }
  if(!d)return toast('备份文件为空');
  if(d.multi&&Array.isArray(d.accounts)){restoreMulti(d);return}
  if(!Array.isArray(d.pools))return toast('备份文件里没有池子数据');
  // 旧格式：恢复到当前账户
  let hit=0,rec=0,skip=0;
  d.pools.forEach(bp=>{
    const p=bp&&bp.name?pools.find(x=>x.name===bp.name):null;
    if(!p){skip++;return}
    p.records=(bp.records||[]).map(r=>({charName:r.charName,drawCount:Number(r.drawCount)||0}));
    if(bp.pity!=null)p.pity=(+bp.pity>=1&&+bp.pity<=40)?Math.round(+bp.pity):40;
    if(!p.up1&&bp.up1)p.up1=bp.up1;        // 只在代码没配的时候补齐，不覆盖代码
    if(!p.up2&&bp.up2)p.up2=bp.up2;
    hit++;rec+=p.records.length;
  });
  recalcAll();save();
  toast('已恢复：'+hit+' 池 / '+rec+' 条记录'
    +(skip?'（跳过 '+skip+' 个池：代码里不存在）':''));
  lsSet('yiruanPool_prev_lastbackup',String(Date.now()));
  subView='overview';go('sub');
}
/** 多账户恢复：按账户名匹配；同名覆盖记录，不存在的账户自动新建 */
function restoreMulti(d){
  save();
  let accNew=0,rec=0;
  (d.accounts||[]).forEach(ba=>{
    if(!ba||!ba.name)return;
    const pack=sanitizePack(ba.data||{});
    pack.pools.forEach(p=>rec+=p.records.length);
    let a=accList.find(x=>x.name===ba.name);
    if(!a){
      const id='a'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36)+(accNew++);
      a={id:id,name:String(ba.name),createdAt:Date.now()};
      accList.push(a);
    }
    lsSet(accDataKey(a.id),JSON.stringify(pack));
  });
  lsSet(ACC_K,JSON.stringify(accList));
  if(!accOf(curAccId)){curAccId=accList[0].id;lsSet(CUR_K,curAccId)}
  load();markAllDirty();render();
  toast('已恢复 '+d.accounts.length+' 个账户：共 '+rec+' 条记录'
    +(accNew?'（新建 '+accNew+' 个账户）':''));
  subView='overview';go('sub');
}

// ========== 副页 · 统计 ==========
function subStatsHTML(){
  const limits=pools.filter(p=>p.type==='limit');
  const withData=limits.filter(p=>(p.records||[]).length);
  // 排名 1：总抽数排行（所有池子，滑动查看）
  const byTotal=[...withData].sort((a,b)=>(b.stat.totalDraw||0)-(a.stat.totalDraw||0));
  // 排名 2：抽齐双 UP 最短抽数
  function uptoFirstBoth(p){
    const r=p.records||[];const u=new Set();
    let acc=0;
    for(let i=0;i<r.length;i++){
      acc+=+r[i].drawCount||0;
      if(r[i].charName===p.up1||r[i].charName===p.up2){
        u.add(r[i].charName);
        if((p.up1&&u.has(p.up1)&&p.up2&&u.has(p.up2))||(p.up1&&u.has(p.up1)&&!p.up2)||(p.up2&&u.has(p.up2)&&!p.up1))return acc;
      }
    }
    return null;
  }
  const byFastest=withData.map(p=>({p,n:uptoFirstBoth(p)})).filter(x=>x.n!=null).sort((a,b)=>a.n-b.n);
  // 排名 3：UP 命中率排行（所有池子）
  const upRates=withData.map(p=>{
    let up1c=0,up2c=0,total=0;
    (p.records||[]).forEach(r=>{total+=+r.drawCount||0;if(r.charName===p.up1)up1c++;if(r.charName===p.up2)up2c++});
    return{p,up1c,up2c,total,rate:total?(up1c+up2c)/total*100:0};
  }).sort((a,b)=>b.rate-a.rate);
  // 排名 4：小保底不歪比例排行（所有池子）
  const byWarp=withData.map(p=>({p,r:p.stat.warpRate||0})).sort((a,b)=>b.r-a.r);

  return '<div class="stat-block collapsed">'+
    '<div class="subhd stat-toggle"><span class="arr">▾</span> 总抽数排行 <span class="hint">点击展开</span></div>'+
    (byTotal.length?rankList(byTotal.map(x=>({nm:x.name+'（'+x.up1+' / '+x.up2+'）',v:x.stat.totalDraw,sub:'抽 · 绝密密探共 '+x.stat.totalSecret+' 个'}))):
     '<div class="subhint">尚未抽卡</div>')+
    '</div>'+

    '<div class="stat-block collapsed">'+
    '<div class="subhd stat-toggle"><span class="arr">▾</span> 抽齐双UP抽数 <span class="hint">点击展开</span></div>'+
    '<div class="subhint" style="margin:-7px 0 10px">从开池到两个 UP 全部首次出现的累计抽数</div>'+
    (byFastest.length?rankList(byFastest.map(x=>({nm:x.p.name+'（'+x.p.up1+' / '+x.p.up2+'）',v:x.n+' 抽',sub:''}))):
     '<div class="subhint">尚未抽到双 UP</div>')+
    '</div>'+

    '<div class="stat-block collapsed">'+
    '<div class="subhd stat-toggle"><span class="arr">▾</span> UP 命中率 <span class="hint">点击展开</span></div>'+
    '<div class="subhint" style="margin:-7px 0 10px">（抽到 UP 的次数 ÷ 总抽数）× 100%</div>'+
    (upRates.length?rankList(upRates.map(x=>({nm:x.p.name+'（'+x.p.up1+' / '+x.p.up2+'）',v:x.rate.toFixed(1)+'%',sub:'/'+x.total+' 抽中 '+(x.up1c+x.up2c)+' 个 UP'}))):
     '<div class="subhint">尚无数据</div>')+
    '</div>'+

    '<div class="stat-block collapsed">'+
    '<div class="subhd stat-toggle"><span class="arr">▾</span> 小保底不歪比例 <span class="hint">点击展开</span></div>'+
    (byWarp.length?rankList(byWarp.map(x=>({nm:x.p.name+'（'+x.p.up1+' / '+x.p.up2+'）',v:(x.r||0).toFixed(1)+'%',sub:'小保底命中 UP 比例'}))):
     '<div class="subhint">尚无数据</div>')+
    '</div>';
}

function rankList(items){
  return '<div class="rank">'+items.map((x,i)=>
    '<div class="ri"><span class="rk">'+(i+1)+'</span>'+
    '<span class="nm">'+x.nm+'</span>'+
    '<span class="v">'+x.v+(x.sub?'<span class="sub">'+x.sub+'</span>':'')+'</span></div>'
  ).join('')+'</div>';
}

/* 图片加载失败统一兜底：默认 jpg 失败（404/损坏）→ 占位（JPEG 全设备兼容，无二级回退） */
window._replaceWithFace=function(img, kind, key, name){
  const box=img.parentNode; if(!box) return;
  img.remove();
  if(kind==='pool'){
    box.classList.add('placeholder');
    box.innerHTML='<div class="ph-text">待填充图片</div>';
  } else {
    box.style.background='linear-gradient(135deg,#b99567,#8c5f2b)';
    box.style.display='flex'; box.style.alignItems='center';
    box.style.justifyContent='center'; box.style.flexDirection='column';
    box.innerHTML='<span style="font-size:22px;font-weight:700;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3)">'
      +(key||name)[0]+'</span><span style="margin-top:6px;letter-spacing:1px;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);opacity:.9">待填充</span>';
  }
};
/* 属性图标 jpg 失败 → 直接隐藏（不打断页面） */
window._replaceAttr=function(img, attr){
  img.style.display='none';
};
/* 顶部 KPI 图标失败 → 隐藏原图并在后面插入圆形占位块，不再显示浏览器裂图 */
window._replaceKPI=function(img){
  const box=img.parentNode; if(!box) return;
  img.style.display='none';
  const ph=document.createElement('div'); ph.className='kpi-ph';
  const txt=img.getAttribute('alt')||img.src.split('/').pop().split('.')[0];
  ph.textContent=(txt||'图')[0];
  box.insertBefore(ph, img.nextSibling);
};

$('#bk').onclick=()=>go('home');
// 顶部账户按钮（多账户切换入口）
$('#accBtn').onclick=openAccMenu;
// 顶部主 nav 切换：主页 / 副页（一次性绑定，DOM 不会被 render 重写）
document.querySelectorAll('#topnav .navtab').forEach(el=>{
  el.onclick=()=>{const t=el.dataset.nav;if(t==='sub'){subView='overview';go('sub')}else go('home')};
});
load();go('home');

/* Service Worker：图片加载过一次后存入手机本地缓存，之后打开直接本地读取（秒开、断网也能看） */
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(function(reg){
      // 首屏渲染完，再让 SW 后台把剩余图片也缓存下来（不抢首屏带宽）
      function kick(){
        var sw=reg.active;
        if(sw) setTimeout(function(){ sw.postMessage({type:'PRECACHE'}); },2000);
      }
      if(reg.active) kick();
      else {
        var w=reg.installing||reg.waiting;
        if(w) w.addEventListener('statechange',function(){ if(w.state==='activated') kick(); });
      }
    }).catch(function(){});
  });
}
</script>
